# PostgreSQL 16 de l'école, en local seulement (conception § 3 et § 6).
# Le port 5442 est choisi car 5432 et 5433 sont pris sur ce poste (ECARTS E-01).
services:
  base:
    image: postgres:16-alpine
    container_name: gs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gs_proprietaire
      POSTGRES_PASSWORD: ${GS_PG_PROPRIETAIRE_MDP:-gs_proprietaire_local}
      POSTGRES_DB: gestion_scolaire
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - gs-pgdata:/var/lib/postgresql/data
      - ./var/sauvegardes:/sauvegardes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gs_proprietaire -d gestion_scolaire"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  gs-pgdata:
